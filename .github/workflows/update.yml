name: Auto update
on:
  schedule:
    - cron: '0 17 * * *' 
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest

    outputs:
      update_available: ${{ steps.checker.outputs.update_available }}
      latest_version: ${{ steps.checker.outputs.latest_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the latest tag
        id: checker 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG=$(gh release list -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "v0.0.0")
          LATEST_TAG=$(gh release list -R reisxd/TizenTubeCobalt -L 1 --json tagName -q '.[0].tagName')

          echo "Latest upstream tag: $LATEST_TAG"

          if [ "$CURRENT_TAG" = "$LATEST_TAG" ]; then
            echo "update_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Update is available."

          LATEST_VERSION=${LATEST_TAG#v}
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

          echo "update_available=true" >> $GITHUB_OUTPUT

  run-update:
    needs: check-update
    if: needs.check-update.outputs.update_available == 'true'
    permissions: write-all
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.check-update.outputs.latest_version }}

  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 6
